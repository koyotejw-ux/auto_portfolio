<!DOCTYPE html>

  <link rel="stylesheet" href="style.css?v=20261128_unified_viewport_v2">
  <style>
    .slide-counter strong { color: #84CC16; }
    .status-dot { background-color: #009DDC; box-shadow: 0 0 10px #009DDC; }
    .live-status-pill {
      background: color-mix(in srgb, #009DDC 14%, transparent);
      border-color: color-mix(in srgb, #009DDC 38%, transparent);
      color: #84CC16;
    }
    .btn-print {
      background: linear-gradient(135deg, #009DDC, #84CC16);
      box-shadow: 0 4px 18px color-mix(in srgb, #009DDC 40%, transparent);
    }
    .rail-item.active .rail-dot {
      background: #84CC16;
      box-shadow: 0 0 12px #009DDC;
    }
  </style>
</head>
<body>

  <!-- Floating Navigation & Master Control Dock -->
  <aside class="global-control-bar" aria-label="Deck Controls">
    <div class="dock-left">
      <a href="../index.html" class="btn-dock-hub" title="메인 포트폴리오 허브로 이동" aria-label="메인 허브로 이동"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>허브</span></a>
      <span class="live-status-pill">
        <span class="status-dot"></span>
        Nexon Korea · 8 Flagship Titles
      </span>
      <span class="deck-title">NEXON PROMOTION · Behance Case Study</span>
    </div>

    <div class="dock-center">
      <button class="nav-arrow-btn" id="btn-prev" title="이전 슬라이드 (←, ↑)" aria-label="Previous Slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="slide-counter" id="slide-counter">SLIDE <strong id="curr-num">01</strong> / 10</span>
      <button class="nav-arrow-btn" id="btn-next" title="다음 슬라이드 (→, ↓, Space)" aria-label="Next Slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="dock-right">
      <button class="btn-icon" id="btn-fitscreen" title="화면 높이 맞춤 토글 (W)" aria-label="Toggle Fit Window">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-fullscreen" title="전체화면 (F)" aria-label="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <a href="Nexon_Promotion_Design_Archive_Portfolio.pdf" download="Nexon_Promotion_Design_Archive_Portfolio.pdf" target="_blank" class="btn-print" style="text-decoration: none;" title="10슬라이드 1920x1080 고해상도 포트폴리오 PDF 다운로드">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        포트폴리오 PDF 다운로드
      </a>
    </div>
  </aside>

  <!-- Right Slide Dot Navigation Rail -->
  <nav class="slide-nav-rail" id="nav-rail" aria-label="Slide Jump Dots"></nav>

  <!-- Keyboard Hint Floating Toast -->
  <div class="key-hint-pill" id="key-hint">
    <span>방향키 <kbd>←</kbd> <kbd>→</kbd> 슬라이드 이동 · <kbd>W</kbd> 화면 높이 맞춤 · <kbd>F</kbd> 전체화면</span>
  </div>

  <!-- Main Slide Deck Feed -->
  <main class="deck-viewport" id="deck-viewport">
    <section class="behance-slide-container" id="slide-1" data-title="01. Hero Cover">
      <img class="behance-slide-img" src="behance_slides/slide_01.png?v=20261128_v2" alt="01. Hero Cover" loading="eager">
    </section>
    <section class="behance-slide-container" id="slide-2" data-title="02. 영웅시대 Main & 4 Campaigns">
      <img class="behance-slide-img" src="behance_slides/slide_02.png?v=20261128_v2" alt="02. 영웅시대 Main & 4 Campaigns" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-3" data-title="03. 클로저스 CBT & Live Events">
      <img class="behance-slide-img" src="behance_slides/slide_03.png?v=20261128_v2" alt="03. 클로저스 CBT & Live Events" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-4" data-title="04. 엘소드 Updates & Avatars">
      <img class="behance-slide-img" src="behance_slides/slide_04.png?v=20261128_v2" alt="04. 엘소드 Updates & Avatars" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-5" data-title="05. 크레이지아케이드 12th & Events">
      <img class="behance-slide-img" src="behance_slides/slide_05.png?v=20261128_v2" alt="05. 크레이지아케이드 12th & Events" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-6" data-title="06. 카트라이더 Season Campaigns">
      <img class="behance-slide-img" src="behance_slides/slide_06.png?v=20261128_v2" alt="06. 카트라이더 Season Campaigns" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-7" data-title="07. 바람의나라 Updates & Events">
      <img class="behance-slide-img" src="behance_slides/slide_07.png?v=20261128_v2" alt="07. 바람의나라 Updates & Events" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-8" data-title="08. 테일즈위버 Episodes & 10th">
      <img class="behance-slide-img" src="behance_slides/slide_08.png?v=20261128_v2" alt="08. 테일즈위버 Episodes & 10th" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-9" data-title="09. 피파온라인3 Sports & UI">
      <img class="behance-slide-img" src="behance_slides/slide_09.png?v=20261128_v2" alt="09. 피파온라인3 Sports & UI" loading="lazy">
    </section>
    <section class="behance-slide-container" id="slide-10" data-title="10. Outcomes & STAR Retrospective">
      <img class="behance-slide-img" src="behance_slides/slide_10.png?v=20261128_v2" alt="10. Outcomes & STAR Retrospective" loading="lazy">
    </section>
  </main>

  <script>
    (function() {
      const slides = Array.from(document.querySelectorAll('.behance-slide-container'));
      const totalSlides = slides.length;
      const currNumEl = document.getElementById('curr-num');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnFitscreen = document.getElementById('btn-fitscreen');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const navRail = document.getElementById('nav-rail');
      const keyHint = document.getElementById('key-hint');
      let currentIndex = 0;

      function toggleFitScreen() {
        const isFit = document.body.classList.toggle('fit-window');
        if (btnFitscreen) btnFitscreen.classList.toggle('active', isFit);
        setTimeout(() => scrollToSlide(currentIndex), 100);
      }
      if (btnFitscreen) btnFitscreen.addEventListener('click', toggleFitScreen);

      slides.forEach((slide, idx) => {
        const dotItem = document.createElement('div');
        dotItem.className = 'rail-item' + (idx === 0 ? ' active' : '');
        dotItem.setAttribute('data-index', idx);
        dotItem.setAttribute('role', 'button');
        dotItem.setAttribute('aria-label', `Slide ${idx + 1}`);
        const dot = document.createElement('div');
        dot.className = 'rail-dot';
        const tooltip = document.createElement('div');
        tooltip.className = 'rail-tooltip';
        tooltip.textContent = slide.getAttribute('data-title') || `Slide ${idx + 1}`;
        dotItem.appendChild(tooltip);
        dotItem.appendChild(dot);
        dotItem.addEventListener('click', () => scrollToSlide(idx));
        navRail.appendChild(dotItem);
      });

      const railDots = Array.from(document.querySelectorAll('.rail-item'));

      function updateActiveState(idx) {
        if (idx === currentIndex) return;
        currentIndex = idx;
        currNumEl.textContent = String(currentIndex + 1).padStart(2, '0');
        railDots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
      }

      function scrollToSlide(idx) {
        if (idx < 0 || idx >= totalSlides) return;
        slides[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
            const index = slides.indexOf(entry.target);
            if (index !== -1) updateActiveState(index);
          }
        });
      }, { root: null, threshold: 0.5 });

      slides.forEach(slide => observer.observe(slide));

      btnPrev.addEventListener('click', () => { if (currentIndex > 0) scrollToSlide(currentIndex - 1); });
      btnNext.addEventListener('click', () => { if (currentIndex < totalSlides - 1) scrollToSlide(currentIndex + 1); });

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) {
          e.preventDefault(); if (currentIndex < totalSlides - 1) scrollToSlide(currentIndex + 1);
        } else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) {
          e.preventDefault(); if (currentIndex > 0) scrollToSlide(currentIndex - 1);
        } else if (e.key === 'Home') {
          e.preventDefault(); scrollToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault(); scrollToSlide(totalSlides - 1);
        } else if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) {
          toggleFullscreen();
        } else if ((e.key === 'w' || e.key === 'W') && !e.metaKey && !e.ctrlKey) {
          toggleFitScreen();
        }
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      }
      btnFullscreen.addEventListener('click', toggleFullscreen);

      setTimeout(() => {
        keyHint.style.opacity = '0';
        setTimeout(() => keyHint.remove(), 600);
      }, 5500);
    })();
  </script>
</body>
</html>
