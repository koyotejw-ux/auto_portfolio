<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXON CLOSERS - 6+1 반응형 공식 웹사이트 UX/UI</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=20261128_closers_v1">
  <style>
    :root {
      --accent-primary: #F59E0B;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --border-accent: rgba(245, 158, 11, 0.45);
    }
    .dock-left .btn-dock-hub { border-color: rgba(245, 158, 11, 0.4); }
    .dock-left .btn-dock-hub:hover { background: rgba(245, 158, 11, 0.15); border-color: #F59E0B; color: #FDE68A; }
    .dock-left .live-status-pill .status-dot { background: #F59E0B; box-shadow: 0 0 10px #F59E0B; }
    .slide-nav-rail .nav-dot.active { background: #F59E0B; box-shadow: 0 0 12px #F59E0B; }
    .btn-print { border-color: rgba(245, 158, 11, 0.4); color: #FEF3C7; }
    .btn-print:hover { background: rgba(245, 158, 11, 0.15); border-color: #F59E0B; color: #FFFFFF; }
    .dock-cl-brand-chip {
      display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 9999px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22) 0%, rgba(180, 83, 9, 0.32) 100%);
      border: 1px solid rgba(245, 158, 11, 0.5); box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
    }
    .dock-cl-brand-chip span { font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; color: #FDE68A; }
  </style>
</head>
<body>

  <aside class="global-control-bar" aria-label="Deck Controls">
    <div class="dock-left">
      <a href="../index.html" class="btn-dock-hub" title="메인 포트폴리오 허브로 이동" aria-label="메인 허브로 이동">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>허브</span>
      </a>
      <span class="live-status-pill"><span class="status-dot"></span>넥슨코리아 클로저스 반응형 공식 웹</span>
      <span class="deck-title">NEXON CLOSERS · Behance Case Study</span>
    </div>

    <div class="dock-center">
      <div class="dock-cl-brand-chip"><span>CLOSERS WEB</span></div>
      <nav class="slide-nav-rail" id="navRail" aria-label="Slide Jump Navigator"></nav>
      <div class="page-indicator" id="pageIndicator" aria-live="polite">
        <span id="curPageNum">1</span> / <span id="totalPageNum">8</span>
      </div>
    </div>

    <div class="dock-right">
      <button type="button" class="btn-print" id="btnDownloadPdf" title="포트폴리오 PDF 다운로드">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span>PDF</span>
      </button>
      <button type="button" class="btn-print" id="btnPrintDeck" title="고화질 인쇄">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        <span>인쇄</span>
      </button>
      <div class="view-mode-toggle">
        <button type="button" class="btn-mode active" id="btnPresentationView">1장</button>
        <button type="button" class="btn-mode" id="btnScrollMode">스크롤</button>
      </div>
    </div>
  </aside>

  <main class="deck-stage" id="deckStage">
    <article class="slide-item active" data-slide="1" id="slide-1"><div class="slide-canvas"><img src="behance_slides/slide_01.png" alt="슬라이드 1: NEXON CLOSERS 히어로" loading="eager" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="2" id="slide-2"><div class="slide-canvas"><img src="behance_slides/slide_02.png" alt="슬라이드 2: 타이포그래피 및 컬러 시스템" loading="lazy" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="3" id="slide-3"><div class="slide-canvas"><img src="behance_slides/slide_03.png" alt="슬라이드 3: 6+1 컬럼 반응형 타일 그리드" loading="lazy" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="4" id="slide-4"><div class="slide-canvas"><img src="behance_slides/slide_04.png" alt="슬라이드 4: 6단계 브레이크포인트 시스템" loading="lazy" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="5" id="slide-5"><div class="slide-canvas"><img src="behance_slides/slide_05.png" alt="슬라이드 5: 동적 GNB 리플로우 인터랙션" loading="lazy" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="6" id="slide-6"><div class="slide-canvas"><img src="behance_slides/slide_06.png" alt="슬라이드 6: 컨텐츠 아티클 기본 및 롤오버 상태" loading="lazy" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="7" id="slide-7"><div class="slide-canvas"><img src="behance_slides/slide_07.png" alt="슬라이드 7: 6대 핵심 서브 페이지 갤러리" loading="lazy" decoding="async" class="slide-img"></div></article>
    <article class="slide-item" data-slide="8" id="slide-8"><div class="slide-canvas"><img src="behance_slides/slide_08.png" alt="슬라이드 8: 프로젝트 성과 및 STAR 회고" loading="lazy" decoding="async" class="slide-img"></div></article>
  </main>

  <script>
    (function() {
      const TOTAL_SLIDES = 8;
      let currentSlide = 1;
      let isScrollMode = false;
      const stage = document.getElementById('deckStage');
      const slides = Array.from(document.querySelectorAll('.slide-item'));
      const navRail = document.getElementById('navRail');
      const curPageNumEl = document.getElementById('curPageNum');
      const btnPresentationView = document.getElementById('btnPresentationView');
      const btnScrollMode = document.getElementById('btnScrollMode');
      const btnPrint = document.getElementById('btnPrintDeck');
      const btnPdf = document.getElementById('btnDownloadPdf');

      for (let i = 1; i <= TOTAL_SLIDES; i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'nav-dot' + (i === 1 ? ' active' : '');
        dot.title = `슬라이드 ${i}로 이동`;
        dot.setAttribute('aria-label', `슬라이드 ${i}`);
        dot.addEventListener('click', () => goToSlide(i));
        navRail.appendChild(dot);
      }
      const dots = Array.from(navRail.querySelectorAll('.nav-dot'));

      function goToSlide(targetIdx) {
        if (targetIdx < 1 || targetIdx > TOTAL_SLIDES) return;
        currentSlide = targetIdx;
        curPageNumEl.textContent = currentSlide;
        dots.forEach((dot, idx) => dot.classList.toggle('active', idx + 1 === currentSlide));
        if (!isScrollMode) {
          slides.forEach((slide, idx) => slide.classList.toggle('active', idx + 1 === currentSlide));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          const targetEl = document.getElementById(`slide-${currentSlide}`);
          if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      btnPresentationView.addEventListener('click', () => {
        if (!isScrollMode) return;
        isScrollMode = false;
        btnPresentationView.classList.add('active');
        btnScrollMode.classList.remove('active');
        stage.classList.remove('scroll-flow-mode');
        goToSlide(currentSlide);
      });

      btnScrollMode.addEventListener('click', () => {
        if (isScrollMode) return;
        isScrollMode = true;
        btnScrollMode.classList.add('active');
        btnPresentationView.classList.remove('active');
        stage.classList.add('scroll-flow-mode');
        slides.forEach(slide => slide.classList.add('active'));
      });

      window.addEventListener('keydown', (e) => {
        if (isScrollMode) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goToSlide(currentSlide + 1); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goToSlide(currentSlide - 1); }
        else if (e.key === 'Home') { e.preventDefault(); goToSlide(1); }
        else if (e.key === 'End') { e.preventDefault(); goToSlide(TOTAL_SLIDES); }
      });

      btnPdf.addEventListener('click', () => {
        const link = document.createElement('a');
        link.href = 'Nexon_Closers_Responsive_Web_Portfolio.pdf';
        link.download = 'Nexon_Closers_Responsive_Web_Portfolio.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      btnPrint.addEventListener('click', () => {
        const prevMode = isScrollMode;
        if (!isScrollMode) slides.forEach(slide => slide.classList.add('active'));
        window.print();
        if (!prevMode) goToSlide(currentSlide);
      });
    })();
  </script>
</body>
</html>
