          <line x1="8" y1="21" x2="16" y2="21"/>

      </button>
      <a href="Korea_History_Quiz_Portfolio.pdf" download="Korea_History_Quiz_Portfolio.pdf" target="_blank" class="btn-print" style="text-decoration: none;" title="12슬라이드 1920x1080 고해상도 포트폴리오 PDF 다운로드">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>

  <!-- Right Slide Dot Navigation Rail -->

    <section class="behance-slide-container" id="slide-3" data-title="03. Persona Matrix">
      <img class="behance-slide-img" src="behance_slides/slide_03.png?v=20261123_real_mockup_v1" alt="Slide 03: Target Persona Matrix" loading="lazy" />

    <section class="behance-slide-container" id="slide-4" data-title="04. Architecture">

    </section>

    <section class="behance-slide-container" id="slide-5" data-title="05. User Flow">
      <img class="behance-slide-img" src="behance_slides/slide_05.png?v=20261123_real_mockup_v1" alt="Slide 05: User Flow & Experience Logic" loading="lazy" />
    </section>

    <section class="behance-slide-container" id="slide-6" data-title="06. Core 01 Home">
      <img class="behance-slide-img" src="behance_slides/slide_06.png?v=20261123_real_mockup_v1" alt="Slide 06: Core Screen 01 Home Dashboard" loading="lazy" />
    </section>

    <section class="behance-slide-container" id="slide-7" data-title="07. Core 02 Exam">
      <img class="behance-slide-img" src="behance_slides/slide_07.png?v=20261123_real_mockup_v1" alt="Slide 07: Core Screen 02 Exam Center" loading="lazy" />
    </section>

    <section class="behance-slide-container" id="slide-8" data-title="08. Core 03 Quiz">
      <img class="behance-slide-img" src="behance_slides/slide_08.png?v=20261123_real_mockup_v1" alt="Slide 08: Core Screen 03 Quiz Commentary" loading="lazy" />
    </section>

    <section class="behance-slide-container" id="slide-9" data-title="09. Core 04 Study">
      <img class="behance-slide-img" src="behance_slides/slide_09.png?v=20261123_real_mockup_v1" alt="Slide 09: Core Screen 04 Study Hall" loading="lazy" />
    </section>

    <section class="behance-slide-container" id="slide-10" data-title="10. Core 05 Vault">
      <img class="behance-slide-img" src="behance_slides/slide_10.png?v=20261123_real_mockup_v1" alt="Slide 10: Core Screen 05 Incorrect Note Vault" loading="lazy" />

    <section class="behance-slide-container" id="slide-11" data-title="11. Design System">
      <img class="behance-slide-img" src="behance_slides/slide_11.png?v=20261123_real_mockup_v1" alt="Slide 11: Visual Identity & Design System" loading="lazy" />
    </section>

    <section class="behance-slide-container" id="slide-12" data-title="12. Retrospective">
      <img class="behance-slide-img" src="behance_slides/slide_12.png?v=20261123_real_mockup_v1" alt="Slide 12: Outcome Metrics & STAR Retrospective" loading="lazy" />
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slides = Array.from(document.querySelectorAll('.behance-slide-container'));
      const currNumEl = document.getElementById('curr-num');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const navRail = document.getElementById('nav-rail');
      const btnFit = document.getElementById('btn-fitscreen');
      const btnFull = document.getElementById('btn-fullscreen');

      let currentIdx = 0;
      let isFitHeight = false;

      // 1. Build Navigation Rail Dots
      slides.forEach((slide, idx) => {
        const dot = document.createElement('button');
        dot.className = 'nav-dot' + (idx === 0 ? ' active' : '');
        dot.title = slide.getAttribute('data-title') || `Slide ${idx + 1}`;
        dot.setAttribute('aria-label', dot.title);
        dot.addEventListener('click', () => {
          scrollToSlide(idx);
        });
        navRail.appendChild(dot);
      });

      const dots = Array.from(navRail.querySelectorAll('.nav-dot'));

      // 2. Scroll and Active State Observation
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = parseInt(entry.target.getAttribute('id').replace('slide-', ''), 10) - 1;
            if (idx >= 0 && idx < slides.length) {
              currentIdx = idx;
              updateActiveUI(currentIdx);
            }
          }
        });
      }, {
        root: null,
        threshold: 0.5
      });

      slides.forEach(s => observer.observe(s));

      function updateActiveUI(idx) {
        currNumEl.textContent = String(idx + 1).padStart(2, '0');
        dots.forEach((d, i) => {
          d.classList.toggle('active', i === idx);
        });
      }

      function scrollToSlide(idx) {
        if (idx < 0 || idx >= slides.length) return;
        slides[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      btnPrev.addEventListener('click', () => {
        if (currentIdx > 0) scrollToSlide(currentIdx - 1);
      });

      btnNext.addEventListener('click', () => {
        if (currentIdx < slides.length - 1) scrollToSlide(currentIdx + 1);
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          if (currentIdx < slides.length - 1) scrollToSlide(currentIdx + 1);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
          e.preventDefault();
          if (currentIdx > 0) scrollToSlide(currentIdx - 1);
        } else if (e.key === 'w' || e.key === 'W') {
          toggleFitWindow();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      function toggleFitWindow() {
        isFitHeight = !isFitHeight;
        document.body.classList.toggle('fit-window-mode', isFitHeight);
        btnFit.classList.toggle('active', isFitHeight);
        scrollToSlide(currentIdx);
      }
      btnFit.addEventListener('click', toggleFitWindow);

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
      btnFull.addEventListener('click', toggleFullscreen);
    });
  </script>
</body>
</html>
