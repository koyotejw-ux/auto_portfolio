  <script>
    // Slide Navigation & Observer
    const slides = Array.from(document.querySelectorAll('.slide-frame'));
    const currNum = document.getElementById('curr-num');
    const navRail = document.getElementById('nav-rail');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFit = document.getElementById('btn-fitscreen');
    const btnFull = document.getElementById('btn-fullscreen');

    let isFitScreen = false;

    // Generate Rail Dots
    slides.forEach((s, idx) => {
      const dot = document.createElement('div');
      dot.className = 'rail-dot';
      dot.title = s.dataset.title || `Slide ${idx + 1}`;
      dot.addEventListener('click', () => {
        s.scrollIntoView({ behavior: 'smooth' });
      });
      navRail.appendChild(dot);
    });
    const dots = Array.from(navRail.children);

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = parseInt(entry.target.dataset.index) - 1;
          currNum.textContent = String(idx + 1).padStart(2, '0');
          dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        }
      });
    }, { threshold: 0.5 });

    slides.forEach(s => observer.observe(s));

    function getCurrentSlideIndex() {
      return parseInt(currNum.textContent, 10) - 1;
    }

    btnPrev.addEventListener('click', () => {
      const cur = getCurrentSlideIndex();
      if (cur > 0) slides[cur - 1].scrollIntoView({ behavior: 'smooth' });
    });

    btnNext.addEventListener('click', () => {
      const cur = getCurrentSlideIndex();
      if (cur < slides.length - 1) slides[cur + 1].scrollIntoView({ behavior: 'smooth' });
    });

    btnFit.addEventListener('click', () => {
      isFitScreen = !isFitScreen;
      slides.forEach(s => {
        if (isFitScreen) {
          s.style.maxHeight = 'calc(100vh - 120px)';
          s.style.width = 'auto';
        } else {
          s.style.maxHeight = 'none';
          s.style.width = '100%';
        }
      });
    });

    btnFull.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        btnNext.click();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        btnPrev.click();
      } else if (e.key === 'w' || e.key === 'W') {
        btnFit.click();
      } else if (e.key === 'f' || e.key === 'F') {
        btnFull.click();
      }
    });
  </script>
